<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>공용 캘린더 — RISE사업단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f7fa;--surface:#fff;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#0f172a;--text2:#334155;--text3:#64748b;--text4:#94a3b8;
  --blue:#2563eb;--blue-l:#eff6ff;--blue-b:#bfdbfe;
  --green:#059669;--green-l:#ecfdf5;
  --yellow:#d97706;--red:#dc2626;--purple:#7c3aed;
  --mono:'DM Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.09);
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
.nav{position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid var(--border);padding:0 40px;box-shadow:var(--shadow)}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;gap:20px}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-chip{background:var(--blue);color:#fff;font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 8px;border-radius:4px;letter-spacing:.06em}
.nav-title{font-size:15px;font-weight:700;color:var(--text)}
.btn-back{background:#fff;border:1px solid var(--border);color:var(--text3);font-size:12px;font-family:var(--mono);padding:7px 14px;border-radius:6px;text-decoration:none;box-shadow:var(--shadow)}
.btn-back:hover{border-color:var(--border2);color:var(--text)}
.main{max-width:1200px;margin:0 auto;padding:36px 40px 60px;display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}

/* CALENDAR */
.cal-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.cal-nav-btn{background:none;border:1px solid var(--border);color:var(--text3);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cal-nav-btn:hover{border-color:var(--blue);color:var(--blue)}
.cal-month-title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-day-header{text-align:center;padding:10px 4px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);letter-spacing:.05em}
.cal-day-header:first-child{color:var(--red)}
.cal-day-header:last-child{color:var(--blue)}
.cal-cell{min-height:90px;padding:6px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);cursor:pointer;transition:background .15s;position:relative;vertical-align:top}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:hover{background:var(--blue-l)}
.cal-cell.today .cal-date{background:var(--blue);color:#fff;border-radius:50%}
.cal-cell.other-month .cal-date{color:var(--text4)}
.cal-cell.sunday .cal-date{color:var(--red)}
.cal-cell.saturday .cal-date{color:var(--blue)}
.cal-date{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:500;margin-bottom:4px}
.cal-events{display:flex;flex-direction:column;gap:2px}
.cal-event{font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;cursor:pointer}
.cal-event.type-schedule{background:var(--blue-l);color:var(--blue);border-left:2px solid var(--blue)}
.cal-event.type-leave{background:var(--green-l);color:var(--green);border-left:2px solid var(--green)}
.cal-event.type-deadline{background:#fef2f2;color:var(--red);border-left:2px solid var(--red)}
.cal-event.type-etc{background:#f5f3ff;color:var(--purple);border-left:2px solid var(--purple)}
.cal-more{font-size:10px;color:var(--text3);padding:2px 6px;cursor:pointer}
.cal-more:hover{color:var(--blue)}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:16px}
.side-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.side-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.side-title::before{content:'';width:3px;height:16px;background:var(--blue);border-radius:2px}

/* 일정 등록 폼 */
.f-label{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:600}
.f-input,.f-select,.f-textarea{width:100%;background:#fff;border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;border-radius:8px;transition:border-color .15s,box-shadow .15s;outline:none;-webkit-appearance:none;margin-bottom:12px}
.f-input:focus,.f-select:focus,.f-textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.f-textarea{resize:vertical;min-height:60px}
.f-select{cursor:pointer}
.type-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.type-btn{font-size:11px;padding:4px 12px;border-radius:50px;border:1px solid var(--border2);background:#fff;color:var(--text3);cursor:pointer;transition:all .15s;font-family:var(--mono)}
.type-btn.active-schedule{background:var(--blue-l);color:var(--blue);border-color:var(--blue-b)}
.type-btn.active-leave{background:var(--green-l);color:var(--green);border-color:#a7f3d0}
.type-btn.active-deadline{background:#fef2f2;color:var(--red);border-color:#fecaca}
.type-btn.active-etc{background:#f5f3ff;color:var(--purple);border-color:#ddd6fe}
.btn-primary{width:100%;background:var(--blue);color:#fff;font-size:13px;font-weight:600;padding:10px;border:none;border-radius:8px;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:#1d4ed8}

/* 일정 목록 */
.event-list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto}
.event-item{padding:10px 12px;border-radius:8px;border:1px solid var(--border);transition:all .15s;cursor:pointer}
.event-item:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.event-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.event-item-title{font-size:13px;font-weight:600;color:var(--text)}
.event-item-date{font-size:11px;font-family:var(--mono);color:var(--text3)}
.event-item-desc{font-size:12px;color:var(--text3)}
.event-item-del{background:none;border:none;color:var(--text4);cursor:pointer;font-size:14px;padding:2px;border-radius:4px;transition:color .15s}
.event-item-del:hover{color:var(--red)}
.event-badge{font-size:10px;padding:1px 8px;border-radius:50px;font-family:var(--mono);font-weight:500}

/* 네비 리모콘 */
.nav-remote{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:300;display:flex;flex-direction:column;gap:6px}
.nr-btn{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .2s;text-decoration:none;color:var(--text3);position:relative}
.nr-btn:hover{border-color:var(--blue);color:var(--blue);transform:scale(1.1)}
.nr-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.nr-tooltip{position:absolute;right:52px;background:var(--text);color:#fff;font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.nr-btn:hover .nr-tooltip{opacity:1}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:440px;box-shadow:var(--shadow-md)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:18px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn-secondary{background:#fff;border:1px solid var(--border);color:var(--text3);font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer}
.btn-danger{background:#fef2f2;border:1px solid #fecaca;color:var(--red);font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer}

.toast{position:fixed;bottom:24px;right:24px;z-index:1000;background:var(--green);color:#fff;font-size:14px;font-weight:600;padding:11px 20px;border-radius:8px;transform:translateY(60px);opacity:0;transition:all .3s cubic-bezier(.16,1,.3,1)}
.toast.show{transform:translateY(0);opacity:1}
.toast.err{background:var(--red)}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--blue);animation:spin .9s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.main{grid-template-columns:1fr}.nav-remote{display:none}.nav{padding:0 16px}.main{padding:24px 16px 48px}}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">
      <span class="nav-chip">RISE</span>
      <span class="nav-title">공용 캘린더</span>
    </a>
    <a href="index.html" class="btn-back">← 전체 현황</a>
  </div>
</nav>

<div class="main">
  <!-- 캘린더 -->
  <div class="cal-card">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="moveMonth(-1)">‹</button>
      <span class="cal-month-title" id="cal-month-title">—</span>
      <button class="cal-nav-btn" onclick="moveMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      <div class="cal-day-header">일</div>
      <div class="cal-day-header">월</div>
      <div class="cal-day-header">화</div>
      <div class="cal-day-header">수</div>
      <div class="cal-day-header">목</div>
      <div class="cal-day-header">금</div>
      <div class="cal-day-header">토</div>
    </div>
    <div class="cal-grid" id="cal-body"></div>
  </div>

  <!-- 사이드바 -->
  <div class="sidebar">
    <!-- 일정 등록 -->
    <div class="side-card">
      <div class="side-title" id="form-title">일정 등록</div>
      <label class="f-label">유형</label>
      <div class="type-btns">
        <button class="type-btn active-schedule" data-type="schedule" onclick="selectType('schedule',this)">📌 일정</button>
        <button class="type-btn" data-type="leave" onclick="selectType('leave',this)">🌿 휴가</button>
        <button class="type-btn" data-type="deadline" onclick="selectType('deadline',this)">🔴 마감</button>
        <button class="type-btn" data-type="etc" onclick="selectType('etc',this)">💜 기타</button>
      </div>
      <label class="f-label">작성자</label>
      <input type="text" class="f-input" id="ev-author" placeholder="이름">
      <label class="f-label">제목</label>
      <input type="text" class="f-input" id="ev-title" placeholder="일정 제목">
      <label class="f-label">날짜</label>
      <input type="date" class="f-input" id="ev-date">
      <label class="f-label">종료일 (선택)</label>
      <input type="date" class="f-input" id="ev-end">
      <label class="f-label">메모 (선택)</label>
      <textarea class="f-textarea" id="ev-memo" placeholder="추가 메모"></textarea>
      <button class="btn-primary" id="save-btn" onclick="saveEvent()">등록하기</button>
      <button class="btn-secondary" id="cancel-edit-btn" onclick="cancelEdit()" style="display:none;width:100%;margin-top:8px">수정 취소</button>
    </div>

    <!-- 이번 달 일정 -->
    <div class="side-card">
      <div class="side-title">이번 달 일정</div>
      <div class="event-list" id="event-list">
        <div class="spin"></div>
      </div>
    </div>
  </div>
</div>

<!-- 일정 상세 모달 -->
<div class="modal-overlay" id="event-modal">
  <div class="modal">
    <h3 id="modal-title">일정 상세</h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">닫기</button>
      <button class="btn-secondary" id="modal-edit-btn">수정</button>
      <button class="btn-danger" id="modal-del-btn">삭제</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- 네비 리모콘 -->
<div class="nav-remote">
  <a href="index.html" class="nr-btn"><span class="nr-tooltip">전체 현황</span>🏠</a>
  <a href="budget.html?p=localrd" class="nr-btn"><span class="nr-tooltip">로컬R&D</span>🔬</a>
  <a href="budget.html?p=overseas" class="nr-btn"><span class="nr-tooltip">해외인재유치</span>✈️</a>
  <a href="budget.html?p=common" class="nr-btn"><span class="nr-tooltip">공통운영경비</span>📦</a>
  <a href="budget.html?p=city" class="nr-btn"><span class="nr-tooltip">시비</span>🏛️</a>
  <a href="calendar.html" class="nr-btn active"><span class="nr-tooltip">캘린더</span>📅</a>
  <a href="document.html?p=localrd" class="nr-btn"><span class="nr-tooltip">공문 색인표</span>📋</a>
  <a href="admin.html" class="nr-btn"><span class="nr-tooltip">관리자</span>⚙️</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyCyCfGii35x0D3Q-Gtk7edATMfD4ycPs08",authDomain:"rise-81dab.firebaseapp.com",projectId:"rise-81dab",storageBucket:"rise-81dab.firebasestorage.app",messagingSenderId:"1059201705038",appId:"1:1059201705038:web:810d08d1e34b37dd51cf1f"};
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.firestore();

const TYPE_LABELS={schedule:'📌 일정',leave:'🌿 휴가',deadline:'🔴 마감',etc:'💜 기타'};
const TYPE_COLORS={schedule:'#2563eb',leave:'#059669',deadline:'#dc2626',etc:'#7c3aed'};

let curYear=new Date().getFullYear(), curMonth=new Date().getMonth();
let allEvents=[], selectedType='schedule', selectedEventId=null, editingId=null;
const today=new Date();

// 오늘 날짜 기본 설정
document.getElementById('ev-date').value=today.toISOString().split('T')[0];

// Firebase 실시간 구독
db.collection('calendarEvents').onSnapshot(snap=>{
  allEvents=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderCalendar();
  renderEventList();
},()=>{allEvents=[];renderCalendar();renderEventList()});

function moveMonth(d){
  curMonth+=d;
  if(curMonth>11){curMonth=0;curYear++;}
  if(curMonth<0){curMonth=11;curYear--;}
  renderCalendar(); renderEventList();
}

function renderCalendar(){
  const title=document.getElementById('cal-month-title');
  title.textContent=`${curYear}년 ${curMonth+1}월`;
  const body=document.getElementById('cal-body');
  const firstDay=new Date(curYear,curMonth,1).getDay();
  const lastDate=new Date(curYear,curMonth+1,0).getDate();
  const prevLastDate=new Date(curYear,curMonth,0).getDate();

  let html='';
  // 이전 달
  for(let i=firstDay-1;i>=0;i--){
    html+=`<div class="cal-cell other-month"><div class="cal-date">${prevLastDate-i}</div></div>`;
  }
  // 이번 달
  for(let d=1;d<=lastDate;d++){
    const dateStr=`${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=d===today.getDate()&&curMonth===today.getMonth()&&curYear===today.getFullYear();
    const dow=new Date(curYear,curMonth,d).getDay();
    const dayEvents=allEvents.filter(e=>{
      if(!e.date) return false;
      if(e.endDate) return dateStr>=e.date&&dateStr<=e.endDate;
      return e.date===dateStr;
    });
    const classes=['cal-cell',isToday?'today':'',dow===0?'sunday':dow===6?'saturday':''].filter(Boolean).join(' ');
    html+=`<div class="${classes}" onclick="clickDate('${dateStr}')">
      <div class="cal-date">${d}</div>
      <div class="cal-events">
        ${dayEvents.slice(0,3).map(e=>`<div class="cal-event type-${e.type||'schedule'}" onclick="event.stopPropagation();openEventModal('${e.id}')" title="${e.title}">${e.title}</div>`).join('')}
        ${dayEvents.length>3?`<div class="cal-more">+${dayEvents.length-3}개</div>`:''}
      </div>
    </div>`;
  }
  // 다음 달
  const remaining=(7-((firstDay+lastDate)%7))%7;
  for(let i=1;i<=remaining;i++){
    html+=`<div class="cal-cell other-month"><div class="cal-date">${i}</div></div>`;
  }
  body.innerHTML=html;
}

function renderEventList(){
  const list=document.getElementById('event-list');
  const monthStr=`${curYear}-${String(curMonth+1).padStart(2,'0')}`;
  const monthEvents=allEvents.filter(e=>e.date&&e.date.startsWith(monthStr))
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(!monthEvents.length){list.innerHTML=`<div style="text-align:center;padding:20px;color:var(--text4);font-size:13px">이번 달 일정이 없습니다</div>`;return}
  list.innerHTML=monthEvents.map(e=>`
    <div class="event-item" onclick="openEventModal('${e.id}')">
      <div class="event-item-header">
        <span class="event-item-title">${e.title||'—'}</span>
        <span class="event-badge" style="background:${TYPE_COLORS[e.type||'schedule']}22;color:${TYPE_COLORS[e.type||'schedule']}">${TYPE_LABELS[e.type||'schedule']}</span>
      </div>
      <div class="event-item-date">${e.date}${e.endDate&&e.endDate!==e.date?' ~ '+e.endDate:''} ${e.author?'· '+e.author:''}</div>
      ${e.memo?`<div class="event-item-desc">${e.memo}</div>`:''}
    </div>`).join('');
}

function selectType(type){
  selectedType=type;
  document.querySelectorAll('.type-btn').forEach(b=>{
    b.className='type-btn';
    if(b.dataset.type===type) b.className='type-btn active-'+type;
  });
}

function clickDate(dateStr){
  document.getElementById('ev-date').value=dateStr;
}

async function saveEvent(){
  const author=document.getElementById('ev-author').value.trim();
  const title=document.getElementById('ev-title').value.trim();
  const date=document.getElementById('ev-date').value;
  const endDate=document.getElementById('ev-end').value||date;
  const memo=document.getElementById('ev-memo').value.trim();
  if(!title||!date){toast('제목과 날짜를 입력하세요.',true);return}
  try{
    if(editingId){
      await db.collection('calendarEvents').doc(editingId).update({
        type:selectedType, author, title, date, endDate, memo,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      cancelEdit();
      toast('✓ 일정이 수정되었습니다');
    }else{
      await db.collection('calendarEvents').add({
        type:selectedType, author, title, date, endDate, memo,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      document.getElementById('ev-title').value='';
      document.getElementById('ev-memo').value='';
      toast('✓ 일정이 등록되었습니다');
    }
  }catch(e){toast('저장 실패: '+e.message,true)}
}

function startEdit(id){
  const ev=allEvents.find(e=>e.id===id);
  if(!ev) return;
  editingId=id;
  selectType(ev.type||'schedule');
  document.getElementById('ev-author').value=ev.author||'';
  document.getElementById('ev-title').value=ev.title||'';
  document.getElementById('ev-date').value=ev.date||'';
  document.getElementById('ev-end').value=(ev.endDate&&ev.endDate!==ev.date)?ev.endDate:'';
  document.getElementById('ev-memo').value=ev.memo||'';
  document.getElementById('form-title').textContent='일정 수정';
  document.getElementById('save-btn').textContent='수정 저장';
  document.getElementById('cancel-edit-btn').style.display='block';
  closeModal();
  document.querySelector('.sidebar').scrollIntoView({behavior:'smooth',block:'start'});
}

function cancelEdit(){
  editingId=null;
  document.getElementById('ev-title').value='';
  document.getElementById('ev-memo').value='';
  document.getElementById('ev-end').value='';
  selectType('schedule');
  document.getElementById('form-title').textContent='일정 등록';
  document.getElementById('save-btn').textContent='등록하기';
  document.getElementById('cancel-edit-btn').style.display='none';
}

function openEventModal(id){
  const ev=allEvents.find(e=>e.id===id);
  if(!ev) return;
  selectedEventId=id;
  document.getElementById('modal-title').textContent=ev.title||'—';
  document.getElementById('modal-body').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--text2)">
      <div><span style="color:var(--text3);font-family:var(--mono);font-size:11px">유형</span><br>${TYPE_LABELS[ev.type||'schedule']}</div>
      <div><span style="color:var(--text3);font-family:var(--mono);font-size:11px">날짜</span><br>${ev.date}${ev.endDate&&ev.endDate!==ev.date?' ~ '+ev.endDate:''}</div>
      ${ev.author?`<div><span style="color:var(--text3);font-family:var(--mono);font-size:11px">작성자</span><br>${ev.author}</div>`:''}
      ${ev.memo?`<div><span style="color:var(--text3);font-family:var(--mono);font-size:11px">메모</span><br>${ev.memo}</div>`:''}
    </div>`;
  document.getElementById('event-modal').classList.add('open');
  document.getElementById('modal-del-btn').onclick=()=>deleteEvent(id);
  document.getElementById('modal-edit-btn').onclick=()=>startEdit(id);
}

async function deleteEvent(id){
  if(!confirm('이 일정을 삭제하시겠습니까?')) return;
  try{
    await db.collection('calendarEvents').doc(id).delete();
    closeModal(); toast('삭제되었습니다');
  }catch(e){toast('삭제 실패: '+e.message,true)}
}

function closeModal(){document.getElementById('event-modal').classList.remove('open')}
document.getElementById('event-modal').addEventListener('click',e=>{if(e.target===document.getElementById('event-modal'))closeModal()});

function toast(msg,isErr=false){
  const el=document.getElementById('toast');el.textContent=msg;el.className='toast'+(isErr?' err':'');
  requestAnimationFrame(()=>el.classList.add('show'));setTimeout(()=>el.classList.remove('show'),2800);
}
</script>
</body>
</html>
