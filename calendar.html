<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>공용 캘린더 — RISE사업단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f7fa;--surface:#fff;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#0f172a;--text2:#334155;--text3:#64748b;--text4:#94a3b8;
  --blue:#2563eb;--blue-l:#eff6ff;--blue-b:#bfdbfe;
  --green:#059669;--green-l:#ecfdf5;
  --yellow:#d97706;--red:#dc2626;--purple:#7c3aed;
  --mono:'DM Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.09);
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
.nav{position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid var(--border);padding:0 40px;box-shadow:var(--shadow)}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;gap:20px}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-chip{background:var(--blue);color:#fff;font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 8px;border-radius:4px;letter-spacing:.06em}
.nav-title{font-size:15px;font-weight:700;color:var(--text)}
.btn-back{background:#fff;border:1px solid var(--border);color:var(--text3);font-size:12px;font-family:var(--mono);padding:7px 14px;border-radius:6px;text-decoration:none;box-shadow:var(--shadow)}
.btn-back:hover{border-color:var(--border2);color:var(--text)}
.main{max-width:1200px;margin:0 auto;padding:36px 40px 60px;display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}

/* CALENDAR */
.cal-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.cal-nav-btn{background:none;border:1px solid var(--border);color:var(--text3);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cal-nav-btn:hover{border-color:var(--blue);color:var(--blue)}
.cal-month-title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-day-header{text-align:center;padding:10px 4px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);letter-spacing:.05em}
.cal-day-header:first-child{color:var(--red)}
.cal-day-header:last-child{color:var(--blue)}
.cal-cell{min-height:90px;padding:6px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);cursor:pointer;transition:background .15s;position:relative;vertical-align:top}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:hover{background:var(--blue-l)}
.cal-cell.today .cal-date{background:var(--blue);color:#fff;border-radius:50%}
.cal-cell.other-month .cal-date{color:var(--text4)}
.cal-cell.sunday .cal-date{color:var(--red)}
.cal-cell.saturday .cal-date{color:var(--blue)}
.cal-date{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:500;margin-bottom:4px}
.cal-events{display:flex;flex-direction:column;gap:2px}
.cal-event{font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;cursor:pointer}
.cal-event.type-schedule{background:var(--blue-l);color:var(--blue);border-left:2px solid var(--blue)}
.cal-event.type-leave{background:var(--green-l);color:var(--green);border-left:2px solid var(--green)}
.cal-event.type-deadline{background:#fef2f2;color:var(--red);border-left:2px solid var(--red)}
.cal-event.type-etc{background:#f5f3ff;color:var(--purple);border-left:2px solid var(--purple)}
.cal-more{font-size:10px;color:var(--text3);padding:2px 6px;cursor:pointer}
.cal-more:hover{color:var(--blue)}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:16px}
.side-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.side-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.side-title::before{content:'';width:3px;height:16px;background:var(--blue);border-radius:2px}

/* 일정 등록 폼 */
.f-label{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:600}
.f-input,.f-select,.f-textarea{width:100%;background:#fff;border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;border-radius:8px;transition:border-color .15s,box-shadow .15s;outline:none;-webkit-appearance:none;margin-bottom:12px}
.f-input:focus,.f-select:focus,.f-textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.f-textarea{resize:vertical;min-height:60px}
.f-select{cursor:pointer}
.type-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.type-btn{font-size:11px;padding:4px 12px;border-radius:50px;border:1px solid var(--border2);background:#fff;color:var(--text3);cursor:pointer;transition:all .15s;font-family:var(--mono)}
.type-btn.active-schedule{background:var(--blue-l);color:var(--blue);border-color:var(--blue-b)}
.type-btn.active-leave{background:var(--green-l);color:var(--green);border-color:#a7f3d0}
.type-btn.active-deadline{background:#fef2f2;color:var(--red);border-color:#fecaca}
.type-btn.active-etc{background:#f5f3ff;color:var(--purple);border-color:#ddd6fe}
.btn-primary{width:100%;background:var(--blue);color:#fff;font-size:13px;font-weight:600;padding:10px;border:none;border-radius:8px;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:#1d4ed8}

/* 일정 목록 */
.event-list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto}
.event-item{padding:10px 12px;border-radius:8px;border:1px solid var(--border);transition:all .15s;cursor:pointer}
.event-item:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.event-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.event-item-title{font-size:13px;font-weight:600;color:var(--text)}
.event-item-date{font-size:11px;font-family:var(--mono);color:var(--text3)}
.event-item-desc{font-size:12px;color:var(--text3)}
.event-item-del{background:none;border:none;color:var(--text4);cursor:pointer;font-size:14px;padding:2px;border-radius:4px;transition:color .15s}
.event-item-del:hover{color:var(--red)}
.event-badge{font-size:10px;padding:1px 8px;border-radius:50px;font-family:var(--mono);font-weight:500}

/* 네비 리모콘 */
.nav-remote{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:300;display:flex;flex-direction:column;gap:6px}
.nr-btn{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .2s;text-decoration:none;color:var(--text3);position:relative}
.nr-btn:hover{border-color:var(--blue);color:var(--blue);transform:scale(1.1)}
.nr-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.nr-tooltip{position:absolute;right:52px;background:var(--text);color:#fff;font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.nr-btn:hover .nr-tooltip{opacity:1}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
#pw-modal{z-index:600}   /* 다른 모달 위에서도 항상 최상단 */
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:440px;box-shadow:var(--shadow-md)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:18px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn-secondary{background:#fff;border:1px solid var(--border);color:var(--text3);font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer}
.btn-danger{background:#fef2f2;border:1px solid #fecaca;color:var(--red);font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer}

.toast{position:fixed;bottom:24px;right:24px;z-index:1000;background:var(--green);color:#fff;font-size:14px;font-weight:600;padding:11px 20px;border-radius:8px;transform:translateY(60px);opacity:0;transition:all .3s cubic-bezier(.16,1,.3,1)}
.toast.show{transform:translateY(0);opacity:1}
.toast.err{background:var(--red)}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--blue);animation:spin .9s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* 휴가 입력 필드 */
#leave-fields{display:none}
.leave-kind-btns{display:flex;gap:6px;margin-bottom:12px}
.leave-kind-btn{flex:1;font-size:12px;padding:7px;border-radius:8px;border:1px solid var(--border2);background:#fff;color:var(--text3);cursor:pointer;transition:all .15s;font-family:var(--mono)}
.leave-kind-btn.on{background:var(--green-l);color:var(--green);border-color:#a7f3d0;font-weight:600}
.days-hint{font-size:11px;color:var(--text3);margin:-6px 0 12px}

/* 잔여 현황 패널 */
.member-row{padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;transition:border-color .15s}
.member-row:hover{border-color:var(--border2)}
.member-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.member-name{font-size:14px;font-weight:700;color:var(--text)}
.member-remain{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--green)}
.member-remain.low{color:var(--red)}
.member-sub{font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:3px}
.member-bar{height:5px;background:var(--border);border-radius:3px;margin-top:8px;overflow:hidden}
.member-bar > i{display:block;height:100%;background:var(--green);border-radius:3px}
.member-actions{display:flex;gap:6px;margin-top:9px}
.mini-btn{font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:6px;border:1px solid var(--border2);background:#fff;color:var(--text3);cursor:pointer;transition:all .12s}
.mini-btn:hover{border-color:var(--blue);color:var(--blue)}
.add-member-btn{width:100%;border:1px dashed var(--border2);background:#fcfdfe;color:var(--text3);font-size:12px;font-family:var(--mono);padding:9px;border-radius:8px;cursor:pointer;transition:all .15s}
.add-member-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-l)}

/* 지급내역 행 */
.grant-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:12px}
.grant-info{color:var(--text2)}
.grant-info b{font-family:var(--mono);color:var(--text)}
.grant-del{background:none;border:none;color:var(--text4);cursor:pointer;font-size:15px;line-height:1}
.grant-del:hover{color:var(--red)}
.grant-add{display:grid;grid-template-columns:1fr 68px 34px;gap:6px;margin-top:10px}
.locked-note{background:var(--green-l);border:1px solid #a7f3d0;color:var(--green);font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
/* 기존 휴가 정리 행 */
.fix-row{display:grid;grid-template-columns:1fr 108px 60px auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.fix-row:last-child{border-bottom:none}
.fix-info b{color:var(--text)}
.fix-info span{color:var(--text3);font-size:11px}
.fix-warn{background:#fffbeb;border:1px solid #fde68a;color:var(--yellow);font-size:12px;font-family:var(--mono);padding:9px;border-radius:8px;margin-bottom:8px;cursor:pointer;width:100%;text-align:center;transition:all .15s}
.fix-warn:hover{background:#fef3c7}
@media(max-width:900px){.main{grid-template-columns:1fr}.nav-remote{display:none}.nav{padding:0 16px}.main{padding:24px 16px 48px}}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">
      <span class="nav-chip">RISE</span>
      <span class="nav-title">공용 캘린더</span>
    </a>
    <a href="index.html" class="btn-back">← 전체 현황</a>
  </div>
</nav>

<div class="main">
  <!-- 캘린더 -->
  <div class="cal-card">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="moveMonth(-1)">‹</button>
      <span class="cal-month-title" id="cal-month-title">—</span>
      <button class="cal-nav-btn" onclick="moveMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      <div class="cal-day-header">일</div>
      <div class="cal-day-header">월</div>
      <div class="cal-day-header">화</div>
      <div class="cal-day-header">수</div>
      <div class="cal-day-header">목</div>
      <div class="cal-day-header">금</div>
      <div class="cal-day-header">토</div>
    </div>
    <div class="cal-grid" id="cal-body"></div>
  </div>

  <!-- 사이드바 -->
  <div class="sidebar">
    <!-- 일정 등록 -->
    <div class="side-card">
      <div class="side-title" id="form-title">일정 등록</div>
      <label class="f-label">유형</label>
      <div class="type-btns">
        <button class="type-btn active-schedule" data-type="schedule" onclick="selectType('schedule',this)">📌 일정</button>
        <button class="type-btn" data-type="leave" onclick="selectType('leave',this)">🌿 휴가</button>
        <button class="type-btn" data-type="deadline" onclick="selectType('deadline',this)">🔴 마감</button>
        <button class="type-btn" data-type="etc" onclick="selectType('etc',this)">💜 기타</button>
      </div>
      <!-- 일반 작성자 (휴가 외) -->
      <div id="author-field">
        <label class="f-label">작성자</label>
        <input type="text" class="f-input" id="ev-author" placeholder="이름">
      </div>
      <!-- 휴가 전용 -->
      <div id="leave-fields">
        <label class="f-label">누구</label>
        <select class="f-select" id="ev-member"></select>
        <label class="f-label">휴가 종류</label>
        <div class="leave-kind-btns">
          <button type="button" class="leave-kind-btn on" data-kind="연차" onclick="selectKind('연차')">연차 (1일)</button>
          <button type="button" class="leave-kind-btn" data-kind="반차" onclick="selectKind('반차')">반차 (0.5일)</button>
        </div>
        <label class="f-label">사용 일수</label>
        <input type="number" class="f-input" id="ev-leavedays" min="0.5" step="0.5" value="1">
        <div class="days-hint" id="days-hint">여러 날이면 일수를 조정하세요 (주말·공휴일 제외)</div>
      </div>
      <label class="f-label">제목</label>
      <input type="text" class="f-input" id="ev-title" placeholder="일정 제목">
      <label class="f-label">날짜</label>
      <input type="date" class="f-input" id="ev-date">
      <label class="f-label">종료일 (선택)</label>
      <input type="date" class="f-input" id="ev-end">
      <label class="f-label">메모 (선택)</label>
      <textarea class="f-textarea" id="ev-memo" placeholder="추가 메모"></textarea>
      <button class="btn-primary" id="save-btn" onclick="saveEvent()">등록하기</button>
      <button class="btn-secondary" id="cancel-edit-btn" onclick="cancelEdit()" style="display:none;width:100%;margin-top:8px">수정 취소</button>
    </div>

    <!-- 휴가 현황 -->
    <div class="side-card">
      <div class="side-title" style="justify-content:space-between">휴가 현황</div>
      <div id="member-list"><div class="spin"></div></div>
      <div id="unlinked-bar"></div>
      <button class="add-member-btn" onclick="openMemberModal()" style="margin-top:4px">+ 구성원 추가</button>
    </div>

    <!-- 이번 달 일정 -->
    <div class="side-card">
      <div class="side-title">이번 달 일정</div>
      <div class="event-list" id="event-list">
        <div class="spin"></div>
      </div>
    </div>
  </div>
</div>

<!-- 일정 상세 모달 -->
<div class="modal-overlay" id="event-modal">
  <div class="modal">
    <h3 id="modal-title">일정 상세</h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">닫기</button>
      <button class="btn-secondary" id="modal-edit-btn">수정</button>
      <button class="btn-danger" id="modal-del-btn">삭제</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- 구성원 추가 모달 -->
<div class="modal-overlay" id="member-modal">
  <div class="modal">
    <h3>구성원 추가</h3>
    <label class="f-label">이름</label>
    <input type="text" class="f-input" id="mm-name" placeholder="예) 박지훈">
    <label class="f-label">비밀번호 (본인 휴가 등록·조회용)</label>
    <input type="password" class="f-input" id="mm-pw" placeholder="비밀번호">
    <label class="f-label">최초 연차 부여 (선택)</label>
    <div class="grant-add" style="margin-top:0">
      <input type="text" class="f-input" id="mm-glabel" placeholder="예) 2025년 상반기" style="margin:0">
      <input type="number" class="f-input" id="mm-gdays" placeholder="일수" min="0" step="0.5" style="margin:0">
      <div></div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeAny('member-modal')">취소</button>
      <button class="btn-primary" style="width:auto;padding:8px 16px" onclick="addMember()">추가</button>
    </div>
  </div>
</div>

<!-- 지급내역 관리 모달 -->
<div class="modal-overlay" id="grants-modal">
  <div class="modal">
    <h3 id="gm-title">지급내역 관리</h3>
    <div class="locked-note">🔓 <span id="gm-unlocked-name"></span> 님 인증됨 · 지급내역을 관리할 수 있습니다</div>
    <div id="gm-summary" class="member-sub" style="margin-bottom:12px"></div>
    <div id="gm-grants"></div>
    <div class="grant-add">
      <input type="text" class="f-input" id="gm-label" placeholder="예) 2025년 하반기" style="margin:0">
      <input type="number" class="f-input" id="gm-days" placeholder="일수" min="0" step="0.5" style="margin:0">
      <button class="btn-primary" style="width:auto;padding:0" onclick="addGrant()">+</button>
    </div>
    <div class="modal-actions" style="justify-content:space-between">
      <button class="btn-danger" onclick="deleteMember()">구성원 삭제</button>
      <button class="btn-secondary" onclick="closeAny('grants-modal')">닫기</button>
    </div>
  </div>
</div>

<!-- 비밀번호 모달 -->
<div class="modal-overlay" id="pw-modal">
  <div class="modal" style="max-width:360px">
    <h3 id="pw-title">비밀번호 입력</h3>
    <p style="font-size:12px;color:var(--text3);margin-bottom:12px" id="pw-desc"></p>
    <input type="password" class="f-input" id="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')pwSubmit()">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="pwCancel()">취소</button>
      <button class="btn-primary" style="width:auto;padding:8px 16px" onclick="pwSubmit()">확인</button>
    </div>
  </div>
</div>

<!-- 기존 휴가 정리 모달 -->
<div class="modal-overlay" id="fix-modal">
  <div class="modal" style="max-width:560px">

<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyCyCfGii35x0D3Q-Gtk7edATMfD4ycPs08",authDomain:"rise-81dab.firebaseapp.com",projectId:"rise-81dab",storageBucket:"rise-81dab.firebasestorage.app",messagingSenderId:"1059201705038",appId:"1:1059201705038:web:810d08d1e34b37dd51cf1f"};
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.firestore();

const TYPE_LABELS={schedule:'📌 일정',leave:'🌿 휴가',deadline:'🔴 마감',etc:'💜 기타'};
const TYPE_COLORS={schedule:'#2563eb',leave:'#059669',deadline:'#dc2626',etc:'#7c3aed'};

let curYear=new Date().getFullYear(), curMonth=new Date().getMonth();
let allEvents=[], selectedType='schedule', selectedEventId=null, editingId=null;
let members=[], selectedKind='연차';
const unlocked=new Set();      // 이번 세션에서 비밀번호 인증된 이름
const today=new Date();

// 비밀번호 해시 (SHA-256)
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function memberByName(n){ return members.find(m=>m.name===n); }
function grantTotal(m){ return (m.grants||[]).reduce((s,g)=>s+(+g.days||0),0); }
function usedDays(name){ return allEvents.filter(e=>e.type==='leave'&&e.author===name).reduce((s,e)=>s+(+e.leaveDays||0),0); }

// 오늘 날짜 기본 설정
document.getElementById('ev-date').value=today.toISOString().split('T')[0];

// Firebase 실시간 구독
db.collection('calendarEvents').onSnapshot(snap=>{
  allEvents=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderCalendar();
  renderEventList();
  renderMembers();
  if(document.getElementById('fix-modal').classList.contains('open')) renderFixList();
},()=>{allEvents=[];renderCalendar();renderEventList()});

// 구성원(연차) 실시간 구독
db.collection('leaveMembers').onSnapshot(snap=>{
  members=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  renderMembers();
  fillMemberSelect();
  if(document.getElementById('grants-modal').classList.contains('open')) renderGrants();
  if(document.getElementById('fix-modal').classList.contains('open')) renderFixList();
},()=>{members=[];renderMembers();fillMemberSelect()});

function moveMonth(d){
  curMonth+=d;
  if(curMonth>11){curMonth=0;curYear++;}
  if(curMonth<0){curMonth=11;curYear--;}
  renderCalendar(); renderEventList();
}

function renderCalendar(){
  const title=document.getElementById('cal-month-title');
  title.textContent=`${curYear}년 ${curMonth+1}월`;
  const body=document.getElementById('cal-body');
  const firstDay=new Date(curYear,curMonth,1).getDay();
  const lastDate=new Date(curYear,curMonth+1,0).getDate();
  const prevLastDate=new Date(curYear,curMonth,0).getDate();

  let html='';
  // 이전 달
  for(let i=firstDay-1;i>=0;i--){
    html+=`<div class="cal-cell other-month"><div class="cal-date">${prevLastDate-i}</div></div>`;
  }
  // 이번 달
  for(let d=1;d<=lastDate;d++){
    const dateStr=`${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=d===today.getDate()&&curMonth===today.getMonth()&&curYear===today.getFullYear();
    const dow=new Date(curYear,curMonth,d).getDay();
    const dayEvents=allEvents.filter(e=>{
      if(!e.date) return false;
      if(e.endDate) return dateStr>=e.date&&dateStr<=e.endDate;
      return e.date===dateStr;
    });
    const classes=['cal-cell',isToday?'today':'',dow===0?'sunday':dow===6?'saturday':''].filter(Boolean).join(' ');
    html+=`<div class="${classes}" onclick="clickDate('${dateStr}')">
      <div class="cal-date">${d}</div>
      <div class="cal-events">
        ${dayEvents.slice(0,3).map(e=>`<div class="cal-event type-${e.type||'schedule'}" onclick="event.stopPropagation();openEventModal('${e.id}')" title="${e.title}">${e.title}</div>`).join('')}
        ${dayEvents.length>3?`<div class="cal-more">+${dayEvents.length-3}개</div>`:''}
      </div>
    </div>`;
  }
  // 다음 달
  const remaining=(7-((firstDay+lastDate)%7))%7;
  for(let i=1;i<=remaining;i++){
    html+=`<div class="cal-cell other-month"><div class="cal-date">${i}</div></div>`;
  }
  body.innerHTML=html;
}

function renderEventList(){
  const list=document.getElementById('event-list');
  const monthStr=`${curYear}-${String(curMonth+1).padStart(2,'0')}`;
  const monthEvents=allEvents.filter(e=>e.date&&e.date.startsWith(monthStr))
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(!monthEvents.length){list.innerHTML=`<div style="text-align:center;padding:20px;color:var(--text4);font-size:13px">이번 달 일정이 없습니다</div>`;return}
  list.innerHTML=monthEvents.map(e=>`
    <div class="event-item" onclick="openEventModal('${e.id}')">
      <div class="event-item-header">
        <span class="event-item-title">${e.title||'—'}</span>
        <span class="event-badge" style="background:${TYPE_COLORS[e.type||'schedule']}22;color:${TYPE_COLORS[e.type||'schedule']}">${TYPE_LABELS[e.type||'schedule']}</span>
      </div>
      <div class="event-item-date">${e.date}${e.endDate&&e.endDate!==e.date?' ~ '+e.endDate:''} ${e.author?'· '+esc(e.author):''}</div>
      ${e.type==='leave'
        ? `<div class="event-item-desc">🌿 ${esc(e.leaveKind||'연차')} ${fmtDays(+e.leaveDays||0)}일 · 상세 잠금</div>`
        : (e.memo?`<div class="event-item-desc">${esc(e.memo)}</div>`:'')}
    </div>`).join('');
}

function selectType(type){
  selectedType=type;
  document.querySelectorAll('.type-btn').forEach(b=>{
    b.className='type-btn';
    if(b.dataset.type===type) b.className='type-btn active-'+type;
  });
  const isLeave=type==='leave';
  document.getElementById('leave-fields').style.display=isLeave?'block':'none';
  document.getElementById('author-field').style.display=isLeave?'none':'block';
  if(isLeave){ fillMemberSelect(); updateDaysDefault(); }
}
function selectKind(kind){
  selectedKind=kind;
  document.querySelectorAll('.leave-kind-btn').forEach(b=>b.classList.toggle('on',b.dataset.kind===kind));
  const days=document.getElementById('ev-leavedays');
  if(kind==='반차'){ days.value='0.5'; days.disabled=true; }
  else{ days.disabled=false; updateDaysDefault(); }
}
function updateDaysDefault(){
  if(selectedKind==='반차'){ document.getElementById('ev-leavedays').value='0.5'; return; }
  const s=document.getElementById('ev-date').value, e=document.getElementById('ev-end').value||s;
  if(s&&e){
    const diff=Math.round((new Date(e)-new Date(s))/86400000)+1;
    document.getElementById('ev-leavedays').value=Math.max(1,diff);
  }
}
function fillMemberSelect(){
  const sel=document.getElementById('ev-member'); if(!sel) return;
  const cur=sel.value;
  sel.innerHTML='<option value="">이름 선택…</option>'+members.map(m=>`<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('');
  if(cur) sel.value=cur;
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function clickDate(dateStr){
  document.getElementById('ev-date').value=dateStr;
  if(selectedType==='leave') updateDaysDefault();
}
document.getElementById('ev-date').addEventListener('change',()=>{ if(selectedType==='leave') updateDaysDefault(); });
document.getElementById('ev-end').addEventListener('change',()=>{ if(selectedType==='leave') updateDaysDefault(); });

function ts(){ return firebase.firestore.FieldValue.serverTimestamp(); }
function resetForm(){ document.getElementById('ev-title').value=''; document.getElementById('ev-memo').value=''; }

async function saveEvent(){
  const date=document.getElementById('ev-date').value;
  const endDate=document.getElementById('ev-end').value||date;
  const memo=document.getElementById('ev-memo').value.trim();
  let title=document.getElementById('ev-title').value.trim();

  // ── 휴가 ──
  if(selectedType==='leave'){
    const name=document.getElementById('ev-member').value;
    const days=parseFloat(document.getElementById('ev-leavedays').value);
    if(!name){toast('휴가 낼 구성원을 선택하세요.',true);return}
    if(!date){toast('날짜를 입력하세요.',true);return}
    if(!(days>0)){toast('사용 일수를 확인하세요.',true);return}
    const ok=await verifyMember(name);       // 본인 비밀번호 확인
    if(!ok) return;
    if(!title) title=`${name} ${selectedKind}`;
    const payload={type:'leave',author:name,title,date,endDate,memo,leaveKind:selectedKind,leaveDays:days};
    try{
      if(editingId){ await db.collection('calendarEvents').doc(editingId).update({...payload,updatedAt:ts()}); cancelEdit(); toast('✓ 휴가가 수정되었습니다'); }
      else{ await db.collection('calendarEvents').add({...payload,createdAt:ts()}); resetForm(); toast('✓ 휴가가 등록되었습니다'); }
    }catch(e){toast('저장 실패: '+e.message,true)}
    return;
  }

  // ── 일반 일정 ──
  const author=document.getElementById('ev-author').value.trim();
  if(!title||!date){toast('제목과 날짜를 입력하세요.',true);return}
  const payload={type:selectedType,author,title,date,endDate,memo};
  try{
    if(editingId){ await db.collection('calendarEvents').doc(editingId).update({...payload,updatedAt:ts()}); cancelEdit(); toast('✓ 일정이 수정되었습니다'); }
    else{ await db.collection('calendarEvents').add({...payload,createdAt:ts()}); resetForm(); toast('✓ 일정이 등록되었습니다'); }
  }catch(e){toast('저장 실패: '+e.message,true)}
}

function startEdit(id){
  const ev=allEvents.find(e=>e.id===id);
  if(!ev) return;
  editingId=id;
  selectType(ev.type||'schedule');
  if(ev.type==='leave'){
    fillMemberSelect();
    document.getElementById('ev-member').value=ev.author||'';
    selectKind(ev.leaveKind||'연차');
    if(ev.leaveDays!=null) document.getElementById('ev-leavedays').value=ev.leaveDays;
  }else{
    document.getElementById('ev-author').value=ev.author||'';
  }
  document.getElementById('ev-title').value=ev.title||'';
  document.getElementById('ev-date').value=ev.date||'';
  document.getElementById('ev-end').value=(ev.endDate&&ev.endDate!==ev.date)?ev.endDate:'';
  document.getElementById('ev-memo').value=ev.memo||'';
  document.getElementById('form-title').textContent=ev.type==='leave'?'휴가 수정':'일정 수정';
  document.getElementById('save-btn').textContent='수정 저장';
  document.getElementById('cancel-edit-btn').style.display='block';
  closeModal();
  document.querySelector('.sidebar').scrollIntoView({behavior:'smooth',block:'start'});
}

function cancelEdit(){
  editingId=null;
  document.getElementById('ev-title').value='';
  document.getElementById('ev-memo').value='';
  document.getElementById('ev-end').value='';
  document.getElementById('ev-member').value='';
  selectKind('연차');
  selectType('schedule');
  document.getElementById('form-title').textContent='일정 등록';
  document.getElementById('save-btn').textContent='등록하기';
  document.getElementById('cancel-edit-btn').style.display='none';
}

async function openEventModal(id){
  const ev=allEvents.find(e=>e.id===id);
  if(!ev) return;
  if(ev.type==='leave' && memberByName(ev.author)){   // 구성원 기록이 있을 때만 잠금
    const ok=await verifyMember(ev.author);
    if(!ok) return;
  }
  selectedEventId=id;
  document.getElementById('modal-title').textContent=ev.title||'—';
  const leaveInfo = ev.type==='leave'
    ? `<div><span style="color:var(--text3);font-family:var(--mono);font-size:11px">휴가</span><br>${esc(ev.leaveKind||'연차')} · ${fmtDays(+ev.leaveDays||0)}일</div>`
    : '';
  document.getElementById('modal-body').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--text2)">
      <div><span style="color:var(--text3);font-family:var(--mono);font-size:11px">유형</span><br>${TYPE_LABELS[ev.type||'schedule']}</div>
      <div><span style="color:var(--text3);font-family:var(--mono);font-size:11px">날짜</span><br>${esc(ev.date)}${ev.endDate&&ev.endDate!==ev.date?' ~ '+esc(ev.endDate):''}</div>
      ${ev.author?`<div><span style="color:var(--text3);font-family:var(--mono);font-size:11px">${ev.type==='leave'?'구성원':'작성자'}</span><br>${esc(ev.author)}</div>`:''}
      ${leaveInfo}
      ${ev.memo?`<div><span style="color:var(--text3);font-family:var(--mono);font-size:11px">메모</span><br>${esc(ev.memo)}</div>`:''}
    </div>`;
  document.getElementById('event-modal').classList.add('open');
  document.getElementById('modal-del-btn').onclick=()=>deleteEvent(id);
  document.getElementById('modal-edit-btn').onclick=()=>startEdit(id);
}

async function deleteEvent(id){
  if(!confirm('이 일정을 삭제하시겠습니까?')) return;
  try{
    await db.collection('calendarEvents').doc(id).delete();
    closeModal(); toast('삭제되었습니다');
  }catch(e){toast('삭제 실패: '+e.message,true)}
}

function closeModal(){document.getElementById('event-modal').classList.remove('open')}
document.getElementById('event-modal').addEventListener('click',e=>{if(e.target===document.getElementById('event-modal'))closeModal()});

/* ══════════ 휴가 현황 · 구성원 · 비밀번호 ══════════ */
function fmtDays(n){ n=+n||0; return Number.isInteger(n)?String(n):n.toFixed(1); }

function renderMembers(){
  const el=document.getElementById('member-list'); if(!el) return;
  if(!members.length){ el.innerHTML=`<div style="text-align:center;padding:14px 0;color:var(--text4);font-size:12px">등록된 구성원이 없습니다<br>아래 버튼으로 추가하세요</div>`; }
  else{
    el.innerHTML=members.map(m=>{
      const total=grantTotal(m), used=usedDays(m.name), remain=total-used;
      const pct=total>0?Math.max(0,Math.min(100,remain/total*100)):0;
      const low=total>0&&remain<=total*0.2;
      return `<div class="member-row">
        <div class="member-top">
          <span class="member-name">${esc(m.name)}</span>
          <span class="member-remain${low?' low':''}">잔여 ${fmtDays(remain)}일</span>
        </div>
        <div class="member-sub">총 부여 ${fmtDays(total)}일 · 사용 ${fmtDays(used)}일</div>
        <div class="member-bar"><i style="width:${pct}%${low?';background:var(--red)':''}"></i></div>
        <div class="member-actions">
          <button class="mini-btn" onclick="manageMember('${m.id}')">지급내역 · 관리</button>
        </div>
      </div>`;
    }).join('');
  }
  // 잔여에 안 잡힌 기존 휴가 안내
  const bar=document.getElementById('unlinked-bar');
  if(bar){
    const n=unlinkedLeaves().length;
    bar.innerHTML = n ? `<button class="fix-warn" onclick="openFixModal()">⚠ 잔여에 안 잡힌 기존 휴가 ${n}건 정리</button>` : '';
  }
}

/* 미연결 휴가 = 구성원과 이름이 안 맞거나 일수가 없는 휴가 */
function unlinkedLeaves(){
  return allEvents.filter(e=>e.type==='leave' && (!memberByName(e.author) || e.leaveDays==null));
}
function openFixModal(){ renderFixList(); document.getElementById('fix-modal').classList.add('open'); }
function renderFixList(){
  const box=document.getElementById('fix-list'); if(!box) return;
  if(!members.length){ box.innerHTML=`<div style="color:var(--text3);font-size:13px;padding:8px 0">먼저 구성원을 추가한 뒤 정리할 수 있습니다.</div>`; return; }
  const un=unlinkedLeaves();
  if(!un.length){ box.innerHTML=`<div style="color:var(--text3);font-size:13px;padding:8px 0">정리할 휴가가 없습니다. 모두 연결되었습니다 ✓</div>`; return; }
  box.innerHTML=un.map(e=>{
    const preName=memberByName(e.author)?e.author:'';
    return `<div class="fix-row" data-id="${e.id}">
      <div class="fix-info"><b>${esc(e.title||'휴가')}</b><br><span>${esc(e.date)}${e.endDate&&e.endDate!==e.date?' ~ '+esc(e.endDate):''} · 작성자 ${esc(e.author||'—')}</span></div>
      <select class="f-select fix-member" style="margin:0">
        <option value="">구성원…</option>
        ${members.map(m=>`<option value="${esc(m.name)}"${m.name===preName?' selected':''}>${esc(m.name)}</option>`).join('')}
      </select>
      <input type="number" class="f-input fix-days" style="margin:0" min="0.5" step="0.5" value="${e.leaveDays!=null?e.leaveDays:1}">
      <button class="mini-btn" onclick="linkLeave('${e.id}')">연결</button>
    </div>`;
  }).join('');
}
async function linkLeave(id){
  const row=document.querySelector(`.fix-row[data-id="${id}"]`); if(!row) return;
  const name=row.querySelector('.fix-member').value;
  const days=parseFloat(row.querySelector('.fix-days').value);
  if(!name){toast('연결할 구성원을 선택하세요.',true);return}
  if(!(days>0)){toast('일수를 확인하세요.',true);return}
  const ok=await verifyMember(name); if(!ok) return;   // 그 구성원 비밀번호 확인
  const ev=allEvents.find(e=>e.id===id);
  try{
    await db.collection('calendarEvents').doc(id).update({
      author:name, leaveDays:days, leaveKind:(ev&&ev.leaveKind)||'연차', updatedAt:ts()
    });
    toast('✓ 연결되었습니다 · 잔여에 반영됩니다');
  }catch(e){toast('연결 실패: '+e.message,true)}
}

/* 구성원 추가 */
function openMemberModal(){
  ['mm-name','mm-pw','mm-glabel','mm-gdays'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('member-modal').classList.add('open');
  setTimeout(()=>document.getElementById('mm-name').focus(),50);
}
async function addMember(){
  const name=document.getElementById('mm-name').value.trim();
  const pw=document.getElementById('mm-pw').value;
  if(!name){toast('이름을 입력하세요.',true);return}
  if(!pw){toast('비밀번호를 입력하세요.',true);return}
  if(memberByName(name)){toast('이미 등록된 이름입니다.',true);return}
  const gLabel=document.getElementById('mm-glabel').value.trim();
  const gDays=parseFloat(document.getElementById('mm-gdays').value);
  const grants=(gDays>0)?[{label:gLabel||'최초 부여',days:gDays,date:new Date().toISOString().split('T')[0]}]:[];
  try{
    const passwordHash=await sha256(pw);
    await db.collection('leaveMembers').add({name,passwordHash,grants,createdAt:ts()});
    unlocked.add(name);
    closeAny('member-modal');
    toast('✓ 구성원이 추가되었습니다');
  }catch(e){toast('저장 실패: '+e.message,true)}
}

/* 지급내역 관리 (비밀번호 인증 후) */
let managedName=null;
async function manageMember(id){
  const m=members.find(x=>x.id===id); if(!m) return;
  const ok=await verifyMember(m.name); if(!ok) return;
  managedName=m.name;
  document.getElementById('gm-title').textContent=`${m.name} · 지급내역`;
  document.getElementById('gm-unlocked-name').textContent=m.name;
  renderGrants();
  document.getElementById('grants-modal').classList.add('open');
}
function renderGrants(){
  const m=memberByName(managedName); if(!m) return;
  const total=grantTotal(m), used=usedDays(m.name);
  document.getElementById('gm-summary').textContent=`총 부여 ${fmtDays(total)}일 · 사용 ${fmtDays(used)}일 · 잔여 ${fmtDays(total-used)}일`;
  const grants=m.grants||[];
  document.getElementById('gm-grants').innerHTML=grants.length
    ? grants.map((gr,i)=>`<div class="grant-row">
        <span class="grant-info"><b>${fmtDays(+gr.days||0)}일</b> · ${esc(gr.label||'(무제목)')}${gr.date?` <span style="color:var(--text4)">${esc(gr.date)}</span>`:''}</span>
        <button class="grant-del" onclick="deleteGrant(${i})" title="삭제">×</button>
      </div>`).join('')
    : `<div style="font-size:12px;color:var(--text4);padding:6px 0">아직 지급내역이 없습니다</div>`;
}
async function addGrant(){
  const m=memberByName(managedName); if(!m) return;
  const label=document.getElementById('gm-label').value.trim();
  const days=parseFloat(document.getElementById('gm-days').value);
  if(!(days>0)){toast('부여 일수를 입력하세요.',true);return}
  const grants=[...(m.grants||[]),{label:label||'연차 부여',days,date:new Date().toISOString().split('T')[0]}];
  try{
    await db.collection('leaveMembers').doc(m.id).update({grants});
    document.getElementById('gm-label').value=''; document.getElementById('gm-days').value='';
    toast('✓ 지급내역이 추가되었습니다');
  }catch(e){toast('저장 실패: '+e.message,true)}
}
async function deleteGrant(i){
  const m=memberByName(managedName); if(!m) return;
  const grants=(m.grants||[]).filter((_,idx)=>idx!==i);
  try{ await db.collection('leaveMembers').doc(m.id).update({grants}); toast('삭제되었습니다'); }
  catch(e){toast('삭제 실패: '+e.message,true)}
}
async function deleteMember(){
  const m=memberByName(managedName); if(!m) return;
  if(!confirm(`${m.name} 구성원을 삭제하시겠습니까?\n(이미 등록된 휴가 일정은 캘린더에 남습니다)`)) return;
  try{ await db.collection('leaveMembers').doc(m.id).delete(); closeAny('grants-modal'); toast('구성원이 삭제되었습니다'); }
  catch(e){toast('삭제 실패: '+e.message,true)}
}

/* 비밀번호 확인 */
async function verifyMember(name){
  if(unlocked.has(name)) return true;
  const m=memberByName(name);
  if(!m){ toast('먼저 구성원으로 등록해주세요.',true); return false; }
  const pw=await askPassword(`${name} 비밀번호`, `${name} 님의 비밀번호를 입력하세요.`);
  if(pw===null) return false;
  let hash;
  try{ hash=await sha256(pw); }
  catch(e){ toast('비밀번호 확인 불가 · HTTPS 주소에서 열어주세요.',true); return false; }
  const ok=hash===m.passwordHash;
  if(ok) unlocked.add(name); else toast('비밀번호가 틀렸습니다.',true);
  return ok;
}
let pwResolve=null;
function askPassword(title,desc){
  return new Promise(res=>{
    pwResolve=res;
    document.getElementById('pw-title').textContent=title||'비밀번호 입력';
    document.getElementById('pw-desc').textContent=desc||'';
    const inp=document.getElementById('pw-input'); inp.value='';
    document.getElementById('pw-modal').classList.add('open');
    setTimeout(()=>inp.focus(),50);
  });
}
function pwSubmit(){ const v=document.getElementById('pw-input').value; document.getElementById('pw-modal').classList.remove('open'); document.getElementById('pw-input').value=''; if(pwResolve){pwResolve(v);pwResolve=null;} }
function pwCancel(){ document.getElementById('pw-modal').classList.remove('open'); document.getElementById('pw-input').value=''; if(pwResolve){pwResolve(null);pwResolve=null;} }

function closeAny(id){ document.getElementById(id).classList.remove('open'); }
['member-modal','grants-modal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{ if(e.target.id===id) closeAny(id); });
});
document.getElementById('fix-modal').addEventListener('click',e=>{ if(e.target.id==='fix-modal') closeAny('fix-modal'); });
document.getElementById('pw-modal').addEventListener('click',e=>{ if(e.target.id==='pw-modal') pwCancel(); });

function toast(msg,isErr=false){
  const el=document.getElementById('toast');el.textContent=msg;el.className='toast'+(isErr?' err':'');
  requestAnimationFrame(()=>el.classList.add('show'));setTimeout(()=>el.classList.remove('show'),2800);
}
</script>
