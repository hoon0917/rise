<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>공문 색인표 — RISE사업단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f7fa;--surface:#fff;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#0f172a;--text2:#334155;--text3:#64748b;--text4:#94a3b8;
  --blue:#2563eb;--blue-l:#eff6ff;--blue-b:#bfdbfe;
  --green:#059669;--red:#dc2626;
  --pc:var(--blue);--pc-l:var(--blue-l);--pc-b:var(--blue-b);
  --mono:'DM Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.09);
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
.nav{position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid var(--border);padding:0 40px;box-shadow:var(--shadow)}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;gap:20px}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-chip{background:var(--pc);color:#fff;font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 8px;border-radius:4px;letter-spacing:.06em}
.nav-title{font-size:15px;font-weight:700;color:var(--text)}
.nav-right{display:flex;gap:8px;align-items:center}
.btn-back{background:#fff;border:1px solid var(--border);color:var(--text3);font-size:12px;font-family:var(--mono);padding:7px 14px;border-radius:6px;text-decoration:none;box-shadow:var(--shadow)}
.btn-back:hover{border-color:var(--border2);color:var(--text)}

/* PROJ TABS */
.proj-tab-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 40px}
.proj-tabs{max-width:1400px;margin:0 auto;display:flex;gap:0}
.proj-tab{padding:12px 20px;font-size:14px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;text-decoration:none;display:block}
.proj-tab:hover{color:var(--text)}
.proj-tab.active{color:var(--pc);border-bottom-color:var(--pc);font-weight:600}

.main{max-width:1400px;margin:0 auto;padding:32px 40px 60px}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sh-label{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;font-weight:600}
.sh-line{flex:1;height:1px;background:var(--border)}
.sh-count{font-family:var(--mono);font-size:11px;color:var(--text3)}

/* 입력 폼 */
.form-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;box-shadow:var(--shadow);margin-bottom:24px}
.form-row{display:grid;grid-template-columns:160px 1fr 140px 120px;gap:12px;align-items:end}
.f-group{display:flex;flex-direction:column;gap:6px}
.f-label{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.f-input{background:#fff;border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;border-radius:8px;transition:border-color .15s,box-shadow .15s;outline:none;width:100%}
.f-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn-primary{background:var(--pc);color:#fff;font-size:13px;font-weight:600;padding:9px 20px;border:none;border-radius:8px;cursor:pointer;transition:background .15s;white-space:nowrap;height:38px}
.btn-primary:hover{filter:brightness(.9)}

/* 검색 */
.search-bar{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.search-input{flex:1;background:#fff;border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 14px;border-radius:8px;outline:none;transition:border-color .15s,box-shadow .15s}
.search-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.search-hint{font-size:12px;color:var(--text3);font-family:var(--mono)}

/* 테이블 */
.doc-table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.doc-table{width:100%;border-collapse:collapse}
.doc-table thead tr{background:#f8fafc;border-bottom:2px solid var(--border)}
.doc-table th{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);padding:11px 16px;text-align:left;font-weight:600;white-space:nowrap}
.doc-table td{padding:13px 16px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--border);transition:background .12s;vertical-align:middle}
.doc-table tr:hover td{background:#fafbfc}
.doc-table tr:last-child td{border-bottom:none}
.doc-num{font-family:var(--mono);font-size:12px;color:var(--pc);font-weight:600}
.doc-title{color:var(--text);font-weight:500}
.doc-date{font-family:var(--mono);font-size:12px;color:var(--text3);white-space:nowrap}
.btn-del{background:#fef2f2;border:1px solid #fecaca;color:var(--red);font-size:11px;font-family:var(--mono);padding:3px 10px;border-radius:6px;cursor:pointer;transition:background .15s}
.btn-del:hover{background:#fee2e2}
.no-data{text-align:center;padding:48px;color:var(--text3);font-size:14px}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--blue);animation:spin .9s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* 네비 리모콘 */
.nav-remote{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:300;display:flex;flex-direction:column;gap:6px}
.nr-btn{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .2s;text-decoration:none;color:var(--text3);position:relative}
.nr-btn:hover{border-color:var(--pc);color:var(--pc);transform:scale(1.1)}
.nr-btn.active{background:var(--pc);color:#fff;border-color:var(--pc)}
.nr-tooltip{position:absolute;right:52px;background:var(--text);color:#fff;font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.nr-btn:hover .nr-tooltip{opacity:1}

.toast{position:fixed;bottom:24px;right:24px;z-index:1000;background:var(--green);color:#fff;font-size:14px;font-weight:600;padding:11px 20px;border-radius:8px;transform:translateY(60px);opacity:0;transition:all .3s cubic-bezier(.16,1,.3,1)}
.toast.show{transform:translateY(0);opacity:1}
.toast.err{background:var(--red)}
@media(max-width:768px){
  .nav,.proj-tab-bar{padding-left:16px;padding-right:16px}
  .main{padding:24px 16px 48px}
  .form-row{grid-template-columns:1fr}
  .nav-remote{display:none}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">
      <span class="nav-chip" id="nav-chip">RISE</span>
      <span class="nav-title">공문 색인표</span>
    </a>
    <div class="nav-right">
      <a href="index.html" class="btn-back">← 전체 현황</a>
    </div>
  </div>
</nav>

<!-- 사업 탭 -->
<div class="proj-tab-bar">
  <div class="proj-tabs">
    <a href="document.html?p=localrd"  class="proj-tab" id="tab-localrd" >🔬 로컬R&amp;D</a>
    <a href="document.html?p=overseas" class="proj-tab" id="tab-overseas">✈️ 해외인재유치</a>
    <a href="document.html?p=common"   class="proj-tab" id="tab-common"  >📦 공통운영경비</a>
  </div>
</div>

<div class="main">
  <!-- 등록 폼 -->
  <div class="form-card">
    <div class="sh" style="margin-bottom:16px"><span class="sh-label">공문 등록</span><div class="sh-line"></div></div>
    <div class="form-row">
      <div class="f-group">
        <label class="f-label">공문 번호</label>
        <input type="text" class="f-input" id="d-num" placeholder="예) 제2026-001호">
      </div>
      <div class="f-group">
        <label class="f-label">공문 제목 <span style="color:var(--red)">*</span></label>
        <input type="text" class="f-input" id="d-title" placeholder="공문 제목을 입력하세요">
      </div>
      <div class="f-group">
        <label class="f-label">날짜 <span style="color:var(--red)">*</span></label>
        <input type="date" class="f-input" id="d-date">
      </div>
      <div class="f-group">
        <label class="f-label" style="opacity:0">등록</label>
        <button class="btn-primary" onclick="saveDoc()">+ 등록하기</button>
      </div>
    </div>
  </div>

  <!-- 목록 -->
  <div class="sh">
    <span class="sh-label">공문 목록</span>
    <div class="sh-line"></div>
    <span class="sh-count" id="doc-count">0건</span>
    <button onclick="downloadDocExcel()" id="btn-doc-dl" style="background:#059669;border:none;color:#fff;font-size:12px;font-family:var(--mono);padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)">⬇ 엑셀 다운로드</button>
  </div>

  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="공문 번호 또는 제목으로 검색…" oninput="applySearch()">
    <span class="search-hint" id="search-hint"></span>
  </div>

  <div class="doc-table-wrap">
    <table class="doc-table">
      <thead>
        <tr>
          <th style="width:48px">No.</th>
          <th style="width:180px">공문 번호</th>
          <th>제목</th>
          <th style="width:120px">날짜</th>
          <th style="width:70px">관리</th>
        </tr>
      </thead>
      <tbody id="doc-tbody">
        <tr><td colspan="5" class="no-data"><div class="spin"></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 네비 리모콘 -->
<div class="nav-remote" id="nav-remote"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyCyCfGii35x0D3Q-Gtk7edATMfD4ycPs08",authDomain:"rise-81dab.firebaseapp.com",projectId:"rise-81dab",storageBucket:"rise-81dab.firebasestorage.app",messagingSenderId:"1059201705038",appId:"1:1059201705038:web:810d08d1e34b37dd51cf1f"};
const PROJECTS={
  localrd: {label:'로컬R&D',    color:'#2563eb',light:'#eff6ff',border:'#bfdbfe'},
  overseas:{label:'해외인재유치',color:'#059669',light:'#ecfdf5',border:'#a7f3d0'},
  common:  {label:'공통운영경비',color:'#d97706',light:'#fffbeb',border:'#fde68a'},
};
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.firestore();

const P=new URLSearchParams(location.search).get('p')||'localrd';
const proj=PROJECTS[P]||PROJECTS.localrd;

// 색상 적용
document.documentElement.style.setProperty('--pc',proj.color);
document.documentElement.style.setProperty('--pc-l',proj.light);
document.documentElement.style.setProperty('--pc-b',proj.border);
document.title=`공문 색인표 — ${proj.label}`;
document.getElementById('nav-chip').textContent=proj.label;

// 탭 active
document.getElementById('tab-'+P)?.classList.add('active');

// 오늘 날짜 기본값
document.getElementById('d-date').value=new Date().toISOString().split('T')[0];

// 네비 리모콘
document.getElementById('nav-remote').innerHTML=[
  {href:'index.html',icon:'🏠',tip:'전체 현황'},
  {href:'budget.html?p=localrd',icon:'🔬',tip:'로컬R&D'},
  {href:'budget.html?p=overseas',icon:'✈️',tip:'해외인재유치'},
  {href:'budget.html?p=common',icon:'📦',tip:'공통운영경비'},
  {href:'budget.html?p=city',icon:'🏛️',tip:'시비'},
  {href:'calendar.html',icon:'📅',tip:'캘린더'},
  {href:`document.html?p=${P}`,icon:'📋',tip:'공문 색인표',active:true},
  {href:'admin.html',icon:'⚙️',tip:'관리자'},
].map(it=>`<a href="${it.href}" class="nr-btn${it.active?' active':''}">${it.icon}<span class="nr-tooltip">${it.tip}</span></a>`).join('');

let allDocs=[], searchQuery='';

// 실시간 구독
db.collection(`${P}_documents`).onSnapshot(snap=>{
  allDocs=snap.docs.map(d=>({id:d.id,...d.data()}));
  allDocs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  render();
},()=>{allDocs=[];render()});

function applySearch(){
  searchQuery=document.getElementById('search-input').value.trim().toLowerCase();
  render();
}

function render(){
  const filtered=searchQuery
    ? allDocs.filter(d=>(d.num||'').toLowerCase().includes(searchQuery)||(d.title||'').toLowerCase().includes(searchQuery))
    : allDocs;
  document.getElementById('doc-count').textContent=filtered.length+'건';
  document.getElementById('search-hint').textContent=searchQuery&&filtered.length!==allDocs.length?`전체 ${allDocs.length}건 중 ${filtered.length}건`:'';
  const tbody=document.getElementById('doc-tbody');
  if(!filtered.length){tbody.innerHTML=`<tr><td colspan="5" class="no-data">${searchQuery?'검색 결과가 없습니다':'등록된 공문이 없습니다'}</td></tr>`;return}
  tbody.innerHTML=filtered.map((d,i)=>`<tr>
    <td style="font-family:var(--mono);font-size:12px;color:var(--text3)">${allDocs.indexOf(d)+1}</td>
    <td class="doc-num">${d.num||'—'}</td>
    <td class="doc-title">${d.title||'—'}</td>
    <td class="doc-date">${d.date||'—'}</td>
    <td><button class="btn-del" onclick="delDoc('${d.id}','${(d.title||'').replace(/'/g,"\\'")}')">삭제</button></td>
  </tr>`).join('');
}

async function saveDoc(){
  const num=document.getElementById('d-num').value.trim();
  const title=document.getElementById('d-title').value.trim();
  const date=document.getElementById('d-date').value;
  if(!title||!date){toast('제목과 날짜를 입력하세요.',true);return}
  try{
    await db.collection(`${P}_documents`).add({
      num, title, date,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('d-num').value='';
    document.getElementById('d-title').value='';
    toast('✓ 공문이 등록되었습니다');
  }catch(e){toast('저장 실패: '+e.message,true)}
}

async function delDoc(id,title){
  if(!confirm(`"${title}" 공문을 삭제하시겠습니까?`)) return;
  try{await db.collection(`${P}_documents`).doc(id).delete();toast('삭제되었습니다')}
  catch(e){toast('삭제 실패: '+e.message,true)}
}

function toast(msg,isErr=false){
  const el=document.getElementById('toast');el.textContent=msg;el.className='toast'+(isErr?' err':'');
  requestAnimationFrame(()=>el.classList.add('show'));setTimeout(()=>el.classList.remove('show'),2800);
}

/* ── 엑셀 다운로드 ── */
function downloadDocExcel(){
  const btn=document.getElementById('btn-doc-dl');
  btn.textContent='생성 중…';btn.disabled=true;
  const today=new Date();
  const todayStr=`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  const wb=XLSX.utils.book_new();
  const rows=[];
  rows.push([`${proj.label} 공문 색인표`, '', '', '', `생성일: ${todayStr}`]);
  rows.push([]);
  rows.push(['No.','공문 번호','제목','날짜']);
  allDocs.forEach((d,i)=>{
    rows.push([i+1, d.num||'', d.title||'', d.date||'']);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:6},{wch:22},{wch:60},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws,'공문목록');
  XLSX.writeFile(wb,`RISE사업_공문색인_${proj.label}_${todayStr.replace(/\./g,'')}.xlsx`);
  btn.textContent='⬇ 엑셀 다운로드';btn.disabled=false;
}
</script>
</body>
</html>
