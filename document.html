<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>공문 색인표 — RISE사업단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f7fa;--surface:#fff;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#0f172a;--text2:#334155;--text3:#64748b;--text4:#94a3b8;
  --blue:#2563eb;--blue-l:#eff6ff;--blue-b:#bfdbfe;
  --green:#059669;--red:#dc2626;
  --pc:var(--blue);--pc-l:var(--blue-l);--pc-b:var(--blue-b);
  --mono:'DM Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.09);
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
.nav{position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid var(--border);padding:0 40px;box-shadow:var(--shadow)}
.nav-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;gap:20px}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-chip{background:var(--pc);color:#fff;font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 8px;border-radius:4px;letter-spacing:.06em}
.nav-title{font-size:15px;font-weight:700;color:var(--text)}
.nav-right{display:flex;gap:8px;align-items:center}
.btn-back{background:#fff;border:1px solid var(--border);color:var(--text3);font-size:12px;font-family:var(--mono);padding:7px 14px;border-radius:6px;text-decoration:none;box-shadow:var(--shadow)}
.btn-back:hover{border-color:var(--border2);color:var(--text)}

/* PROJ TABS */
.proj-tab-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 40px}
.proj-tabs{max-width:1600px;margin:0 auto;display:flex;gap:0;flex-wrap:wrap}
.proj-tab{padding:12px 20px;font-size:14px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;text-decoration:none;display:block}
.proj-tab:hover{color:var(--text)}
.proj-tab.active{color:var(--pc);border-bottom-color:var(--pc);font-weight:600}

.main{max-width:1600px;margin:0 auto;padding:32px 40px 60px}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sh-label{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;font-weight:600}
.sh-line{flex:1;height:1px;background:var(--border)}
.sh-count{font-family:var(--mono);font-size:11px;color:var(--text3)}

/* 업로드 존 */
.upload-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);margin-bottom:16px}
.upload-zone{border:2px dashed var(--border2);border-radius:10px;padding:26px 20px;text-align:center;cursor:pointer;transition:all .18s;background:#fcfdfe}
.upload-zone:hover,.upload-zone.drag{border-color:var(--pc);background:var(--pc-l)}
.uz-icon{font-size:30px;line-height:1;margin-bottom:8px}
.uz-title{font-size:14px;font-weight:600;color:var(--text2)}
.uz-title b{color:var(--pc)}
.uz-sub{font-size:12px;color:var(--text3);margin-top:5px;font-family:var(--mono)}

/* 입력 폼 */
.form-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;box-shadow:var(--shadow);margin-bottom:24px}
.form-row{display:grid;grid-template-columns:150px 130px 1fr 130px 120px;gap:12px;align-items:end}
.f-group{display:flex;flex-direction:column;gap:6px}
.f-label{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.f-input,.f-select{background:#fff;border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;border-radius:8px;transition:border-color .15s,box-shadow .15s;outline:none;width:100%}
.f-input:focus,.f-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn-primary{background:var(--pc);color:#fff;font-size:13px;font-weight:600;padding:9px 20px;border:none;border-radius:8px;cursor:pointer;transition:filter .15s;white-space:nowrap;height:38px}
.btn-primary:hover{filter:brightness(.9)}

/* 툴바 */
.toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;background:#fff;border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 14px;border-radius:8px;outline:none;transition:border-color .15s,box-shadow .15s}
.search-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.search-hint{font-size:12px;color:var(--text3);font-family:var(--mono)}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden}
.seg button{background:#fff;border:none;font-family:var(--mono);font-size:12px;color:var(--text3);padding:8px 14px;cursor:pointer;transition:all .12s}
.seg button.on{background:var(--pc);color:#fff}
.seg button+button{border-left:1px solid var(--border2)}
.btn-tool{background:#fff;border:1px solid var(--border2);color:var(--text3);font-size:12px;font-family:var(--mono);padding:8px 14px;border-radius:8px;cursor:pointer;transition:all .12s;white-space:nowrap}
.btn-tool:hover{border-color:var(--pc);color:var(--pc)}
.btn-dl{background:#059669;border:none;color:#fff;font-size:12px;font-family:var(--mono);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* 테이블 */
.doc-table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow)}
.doc-table{width:100%;border-collapse:collapse;min-width:820px}
.doc-table.detail{min-width:1320px}
.doc-table thead tr{background:#f8fafc;border-bottom:2px solid var(--border)}
.doc-table th{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);padding:11px 14px;text-align:left;font-weight:600;white-space:nowrap}
.doc-table td{padding:12px 14px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--border);vertical-align:middle}
.doc-table tr:hover td{background:#fafbfc}
.doc-table tr:last-child td{border-bottom:none}
/* 연차 구분줄 */
.group-row td{background:var(--pc-l)!important;border-top:2px solid var(--pc-b);border-bottom:1px solid var(--pc-b);padding:9px 14px;cursor:pointer;user-select:none}
.group-row:first-child td{border-top:none}
.gr-caret{display:inline-block;width:14px;color:var(--pc);font-size:11px}
.gr-label{font-weight:700;color:var(--pc);font-size:13px;margin-right:8px}
.gr-range{font-family:var(--mono);font-size:11px;color:var(--text3);margin-right:8px}
.gr-count{font-family:var(--mono);font-size:11px;color:var(--pc);background:#fff;border:1px solid var(--pc-b);padding:1px 8px;border-radius:20px}
.col-detail{display:none}
.doc-table.detail .col-detail{display:table-cell}
.doc-table.detail .col-simple{display:none}
.doc-num{font-family:var(--mono);font-size:12px;color:var(--pc);font-weight:600;white-space:nowrap}
.doc-title{color:var(--text);font-weight:500;min-width:240px}
.doc-date{font-family:var(--mono);font-size:12px;color:var(--text3);white-space:nowrap}
.doc-idx{font-family:var(--mono);font-size:12px;color:var(--text4)}
.cell-sm{font-size:12px;color:var(--text3)}
.badge{display:inline-block;font-size:11px;font-weight:600;font-family:var(--mono);padding:2px 8px;border-radius:5px;white-space:nowrap}
.scan-o{color:var(--green);font-weight:700} .scan-x{color:var(--red);font-weight:700}
.btn-del{background:#fef2f2;border:1px solid #fecaca;color:var(--red);font-size:11px;font-family:var(--mono);padding:3px 10px;border-radius:6px;cursor:pointer;transition:background .15s}
.btn-del:hover{background:#fee2e2}
.no-data{text-align:center;padding:48px;color:var(--text3);font-size:14px}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--blue);animation:spin .9s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* 모달 */
.modal-ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-ov.show{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:920px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-head h3{font-size:16px;font-weight:700;color:var(--text)}
.modal-head .x{background:none;border:none;font-size:22px;color:var(--text4);cursor:pointer;line-height:1}
.modal-body{padding:20px 24px;overflow-y:auto}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mp-stat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.mp-stat .b{background:var(--pc-l);border:1px solid var(--pc-b);border-radius:8px;padding:8px 14px}
.mp-stat .b .n{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--pc);line-height:1}
.mp-stat .b .l{font-size:11px;color:var(--text3);margin-top:3px}
.prev-table{width:100%;border-collapse:collapse;font-size:12px}
.prev-table th{background:#f8fafc;font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--text3);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0}
.prev-table td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text2)}
.prev-wrap{max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.opt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:7px;border:1px solid var(--border2);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .12s}
.opt.on{border-color:var(--pc);background:var(--pc-l);color:var(--pc);font-weight:600}
.btn-ghost{background:#fff;border:1px solid var(--border2);color:var(--text3);font-size:13px;padding:9px 18px;border-radius:8px;cursor:pointer;font-weight:500}
.btn-ghost:hover{border-color:var(--border2);color:var(--text)}

/* 네비 리모콘 */
.nav-remote{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:300;display:flex;flex-direction:column;gap:6px}
.nr-btn{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .2s;text-decoration:none;color:var(--text3);position:relative}
.nr-btn:hover{border-color:var(--pc);color:var(--pc);transform:scale(1.1)}
.nr-btn.active{background:var(--pc);color:#fff;border-color:var(--pc)}
.nr-tooltip{position:absolute;right:52px;background:var(--text);color:#fff;font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.nr-btn:hover .nr-tooltip{opacity:1}

.toast{position:fixed;bottom:24px;right:24px;z-index:1000;background:var(--green);color:#fff;font-size:14px;font-weight:600;padding:11px 20px;border-radius:8px;transform:translateY(60px);opacity:0;transition:all .3s cubic-bezier(.16,1,.3,1)}
.toast.show{transform:translateY(0);opacity:1}
.toast.err{background:var(--red)}
@media(max-width:768px){
  .nav,.proj-tab-bar{padding-left:16px;padding-right:16px}
  .main{padding:24px 16px 48px}
  .form-row{grid-template-columns:1fr 1fr}
  .nav-remote{display:none}
}
</style>
</head>

<!-- 사업 탭 -->
<div class="proj-tab-bar">

    <a href="document.html?p=overseas" class="proj-tab" id="tab-overseas">✈️ 해외인재유치</a>
    <a href="document.html?p=common"   class="proj-tab" id="tab-common"  >📦 공통운영경비</a>
    <a href="document.html?p=city"     class="proj-tab" id="tab-city"    >🏛️ 시비</a>
  </div>
</div>

<div class="main">

  <!-- 엑셀 업로드 -->
  <div class="upload-card">
    <div class="sh" style="margin-bottom:14px"><span class="sh-label">엑셀 일괄 등록</span><div class="sh-line"></div></div>
    <div class="upload-zone" id="upload-zone">
      <div class="uz-icon">📄</div>
      <div class="uz-title"><b>엑셀 색인표 파일</b>을 끌어다 놓거나 클릭해서 선택하세요</div>
      <div class="uz-sub">.xlsx / .xls · 문서번호·제목·날짜·구분·비목 등 자동 인식</div>
    </div>
    <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none">
  </div>

  <!-- 개별 등록 폼 -->
  <div class="form-card">
    <div class="sh" style="margin-bottom:16px"><span class="sh-label">개별 등록</span><div class="sh-line"></div></div>
    <div class="form-row">
      <div class="f-group">
        <label class="f-label">날짜 <span style="color:var(--red)">*</span></label>
        <input type="date" class="f-input" id="d-date">
      </div>
      <div class="f-group">
        <label class="f-label">문서번호</label>
        <input type="text" class="f-input" id="d-num" placeholder="예) 001">
      </div>
      <div class="f-group">
        <label class="f-label">제목 <span style="color:var(--red)">*</span></label>
        <input type="text" class="f-input" id="d-title" placeholder="공문 제목을 입력하세요">
      </div>
      <div class="f-group">
        <label class="f-label">구분</label>
        <select class="f-select" id="d-type">
          <option value="">—</option>
          <option>계획</option><option>지출</option><option>출장</option>
          <option>보고</option><option>급여</option><option>휴가</option><option>기타</option>
        </select>
      </div>
      <div class="f-group">
        <label class="f-label" style="opacity:0">등록</label>
        <button class="btn-primary" onclick="saveDoc()">+ 등록하기</button>
      </div>
    </div>
  </div>

  <!-- 목록 -->
  <div class="sh">
    <span class="sh-label">공문 목록</span>
    <div class="sh-line"></div>
    <span class="sh-count" id="doc-count">0건</span>
  </div>

  <div class="toolbar">
    <input type="text" class="search-input" id="search-input" placeholder="문서번호·제목·구분·비목으로 검색…" oninput="applySearch()">
    <span class="search-hint" id="search-hint"></span>
    <div class="seg" id="view-seg">
      <button class="on" data-view="simple" onclick="setView('simple')">간단히</button>
      <button data-view="detail" onclick="setView('detail')">상세히</button>
    </div>
    <button class="btn-tool" id="sort-btn" onclick="toggleSort()">↑ 오름차순</button>
    <button class="btn-dl" onclick="downloadDocExcel()" id="btn-doc-dl">⬇ 엑셀 다운로드</button>
  </div>

  <div class="doc-table-wrap">
    <table class="doc-table" id="doc-table">
      <thead>
        <tr>
          <th style="width:44px">No.</th>
          <th class="col-detail" style="width:56px">스캔</th>
          <th style="width:112px">날짜</th>
          <th style="width:110px">문서번호</th>
          <th class="col-detail" style="width:64px">구분</th>
          <th class="col-detail" style="width:70px">로컬/해외</th>
          <th class="col-detail" style="width:150px">항목</th>
          <th class="col-detail" style="width:100px">비목</th>
          <th class="col-detail" style="width:110px">세목</th>
          <th class="col-detail" style="width:90px">역량</th>
          <th>제목</th>
          <th class="col-simple" style="width:64px">구분</th>
          <th style="width:66px">관리</th>
        </tr>
      </thead>
      <tbody id="doc-tbody">
        <tr><td colspan="13" class="no-data"><div class="spin"></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 업로드 미리보기 모달 -->
<div class="modal-ov" id="prev-modal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="prev-title">엑셀 미리보기</h3>
      <button class="x" onclick="closePreview()">×</button>

      <div class="mp-stat" id="mp-stat"></div>

        <div class="f-label" style="margin-bottom:8px">등록 방식</div>

      </div>
    </div>
  </div>
</div>

function docNumOf(d){ return d.docNum ?? d.num ?? ''; }
function seqOf(d){ return (typeof d.seq==='number') ? d.seq : (d.createdAt?.seconds || 0); }

/* ── 연차(회계연도) 구분 — 3월 1일 시작, 1차년도 = 2025.03 ~ 2026.02 ── */
const FY_START=2025;                 // 1차년도 시작 연도
const FY_INFO={
  1:{label:'1차년도', range:'2025.03 ~ 2026.02'},
  2:{label:'2차년도', range:'2026.03 ~ 2027.02'},
  3:{label:'3차년도', range:'2027.03 ~ 2028.02'},
  4:{label:'4차년도', range:'2028.03 ~ 2029.02'},
  5:{label:'5차년도', range:'2029.03 ~ 2030.02'},
};
function fiscalYear(dateStr){          // 1~5 반환, 범위 밖·날짜없음 → null
  if(!dateStr) return null;
  const m=String(dateStr).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);   // 한 자리 월·일도 허용
  if(!m) return null;
  const y=+m[1], mo=+m[2];
  if(mo<1||mo>12) return null;
  const startY = (mo>=3) ? y : y-1;   // 1~2월은 전년도 회계연도
  const fy = startY - FY_START + 1;
  return (fy>=1 && fy<=5) ? fy : null;
}
function fyKey(d){ const fy=fiscalYear(d.date); return fy==null?'x':String(fy); }
function fyOrder(d){ const fy=fiscalYear(d.date); return fy==null?99:fy; }   // 미분류는 항상 맨 뒤

// 문서번호 자연 정렬 (055 < 057, 018 < 018-1 < 019, 숫자없음/공란은 맨 뒤)
function docNumKey(dn){
  const s=String(dn||'').trim();
  const m=s.match(/(\d+)(?:\s*-\s*(\d+))?/);
  if(!m) return [Infinity, Infinity, s];
  return [parseInt(m[1],10), m[2]?parseInt(m[2],10):-1, s];
}
function cmpDocNum(a,b){
  const ka=docNumKey(a), kb=docNumKey(b);
  if(ka[0]!==kb[0]) return ka[0]-kb[0];
  if(ka[1]!==kb[1]) return ka[1]-kb[1];
  return ka[2].localeCompare(kb[2]);
}

function sortDocs(){
  allDocs.sort((a,b)=>{
    // 1) 연차 (미분류는 항상 맨 뒤, 오름/내림 무관)
    const fa=fyOrder(a), fb=fyOrder(b);
    if(fa!==fb){
      if(fa===99) return 1;
      if(fb===99) return -1;
      return sortAsc? fa-fb : fb-fa;
    }
    // 2) 문서번호
    const c=cmpDocNum(docNumOf(a),docNumOf(b));
    if(c!==0) return sortAsc? c : -c;
    // 3) 날짜  4) 입력순
    const dc=(a.date||'9999-99-99').localeCompare(b.date||'9999-99-99');
    if(dc!==0) return sortAsc? dc : -dc;
    return sortAsc? seqOf(a)-seqOf(b) : seqOf(b)-seqOf(a);
  });
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function typeBadge(t){

function docRowHtml(d,idx){
  const sv=String(d.scan==null?'':d.scan).trim().toUpperCase();
  const scan=(sv==='0'||sv==='O'||sv==='✓'||sv==='Y')?'<span class="scan-o">✓</span>'
           :(sv==='X'||sv==='✗')?'<span class="scan-x">✗</span>':'<span class="cell-sm">—</span>';
  return `<tr>
      <td class="doc-idx">${idx}</td>
      <td class="col-detail" style="text-align:center">${scan}</td>
      <td class="doc-date">${esc(d.date)||'—'}</td>
      <td class="doc-num">${esc(docNumOf(d))||'—'}</td>
      <td class="col-detail">${typeBadge(d.type)}</td>
      <td class="col-detail cell-sm">${esc(d.region)||'—'}</td>
      <td class="col-detail cell-sm">${esc(d.item)||'—'}</td>
      <td class="col-detail cell-sm">${esc(d.bimok)||'—'}</td>
      <td class="col-detail cell-sm">${esc(d.semok)||'—'}</td>
      <td class="col-detail cell-sm">${esc(d.capability)||'—'}</td>
      <td class="doc-title">${esc(d.title)||'—'}</td>
      <td class="col-simple">${typeBadge(d.type)}</td>
      <td><button class="btn-del" data-id="${d.id}" data-title="${esc(d.title)}">삭제</button></td>
    </tr>`;
}
function groupRowHtml(key,count){
  const info = key==='x' ? {label:'미분류', range:'날짜 미입력 또는 사업기간 외'} : FY_INFO[+key];
  const collapsed=collapsedFY.has(key) && !searchQuery;   // 검색 중엔 항상 펼침
  return `<tr class="group-row" data-fy="${key}">
      <td colspan="13">
        <span class="gr-caret">${collapsed?'▸':'▾'}</span>
        <span class="gr-label">${info.label}</span>
        <span class="gr-range">${info.range}</span>
        <span class="gr-count">${count}건</span>
      </td>
    </tr>`;
}

function render(){
  const filtered=searchQuery
    ? allDocs.filter(d=>[docNumOf(d),d.title,d.type,d.bimok,d.item,d.semok,d.capability].some(v=>String(v||'').toLowerCase().includes(searchQuery)))
    : allDocs;
  document.getElementById('doc-count').textContent=filtered.length+'건';
  document.getElementById('search-hint').textContent=searchQuery&&filtered.length!==allDocs.length?`전체 ${allDocs.length}건 중 ${filtered.length}건`:'';
  const tbody=document.getElementById('doc-tbody');
  if(!filtered.length){tbody.innerHTML=`<tr><td colspan="13" class="no-data">${searchQuery?'검색 결과가 없습니다':'등록된 공문이 없습니다 · 엑셀을 업로드해 일괄 등록해보세요'}</td></tr>`;return}

  // 연차별 건수 집계
  const counts={};
  filtered.forEach(d=>{ const k=fyKey(d); counts[k]=(counts[k]||0)+1; });

  // allDocs가 이미 (연차→문서번호) 순으로 정렬돼 있어, 그 순서대로 그룹 헤더를 끼워 렌더
  let html='', curKey=null, nInGroup=0;
  filtered.forEach(d=>{
    const k=fyKey(d);
    if(k!==curKey){ curKey=k; nInGroup=0; html+=groupRowHtml(k,counts[k]); }
    if(collapsedFY.has(k) && !searchQuery) return;   // 접힌 연차는 생략(단, 검색 중엔 표시)
    nInGroup++;
    html+=docRowHtml(d,nInGroup);
  });
  tbody.innerHTML=html;
}

async function saveDoc(){

function normH(s){ return String(s==null?'':s).replace(/\s+/g,'').replace(/[.]/g,''); }
function isHeaderRow(row){
  const j=row.map(c=>normH(c)).join('|');
  return j.includes('제목') && (j.includes('문서번호')||j.includes('NO'));
}
function mapHeader(row){
  const m={};
  row.forEach((cell,idx)=>{
    if(cell==null) return;
    const h=normH(cell);
    if(m.note===undefined && (h.includes('중복')||h.includes('공란'))){m.note=idx;return}
    if(m.title===undefined && h.includes('제목')){m.title=idx;return}
    if(m.docNum===undefined && h.includes('문서번호')){m.docNum=idx;return}
    if(m.scan===undefined && h.includes('스캔')){m.scan=idx;return}
    if(m.region===undefined && (h.includes('로컬')||h.includes('해외'))){m.region=idx;return}
    if(m.type===undefined && h.includes('계획')&&h.includes('지출')){m.type=idx;return}
    if(m.item===undefined && h.includes('항목')){m.item=idx;return}
    if(m.bimok===undefined && h.includes('비목')){m.bimok=idx;return}
    if(m.semok===undefined && h.includes('세목')){m.semok=idx;return}
    if(m.capability===undefined && (h.includes('체험')||h.includes('역량')||h.includes('직업능력'))){m.capability=idx;return}
    if(m.date===undefined && (h.includes('월일')||h.includes('날짜')||h.includes('일자')||h.includes('작성일'))){m.date=idx;return}
    if(m.no===undefined && h==='NO'){m.no=idx;return}
  });
  return m;
}
function fmtDate(v){
  if(v==null||v==='') return '';
  if(v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v==='number' && XLSX.SSF){
    const o=XLSX.SSF.parse_date_code(v);
    if(o) return `${o.y}-${String(o.m).padStart(2,'0')}-${String(o.d).padStart(2,'0')}`;
  }
  const s=String(v).trim();
  const m=s.match(/^(\d{4})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{1,2})/);  // 2026.3.3 / 2026/03/03 등
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return s;
}
function cell(r,idx){ return (idx!=null && r[idx]!=null) ? String(r[idx]).trim() : ''; }

let pendingRows=[], uploadMode='new';

// 중복 대조 키 (날짜·문서번호·제목이 모두 같으면 동일 공문으로 간주)
function dupKey(date,docNum,title){
  return `${String(date||'').trim()}|${String(docNum||'').trim()}|${String(title||'').trim()}`;
}

function handleFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      const rows=[]; const sheetInfo=[];
      wb.SheetNames.forEach(name=>{
        const arr=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,cellDates:true,defval:null});
        let h=-1;
        for(let i=0;i<arr.length;i++){ if(isHeaderRow(arr[i])){h=i;break} }
        if(h<0) return;
        const map=mapHeader(arr[h]);
        let cnt=0;
        for(let i=h+1;i<arr.length;i++){
          const r=arr[i];
          const title=map.title!=null?r[map.title]:null;
          const dn=map.docNum!=null?r[map.docNum]:null;
          if((title==null||String(title).trim()==='')&&(dn==null||String(dn).trim()===''))continue;
          rows.push({
            date:fmtDate(map.date!=null?r[map.date]:''),
            docNum:cell(r,map.docNum),
            title:cell(r,map.title),
            type:cell(r,map.type),
            region:cell(r,map.region),
            item:cell(r,map.item),
            bimok:cell(r,map.bimok),
            semok:cell(r,map.semok),
            capability:cell(r,map.capability),
            scan:cell(r,map.scan),
            note:cell(r,map.note),
          });
          cnt++;
        }
        sheetInfo.push({name,cnt});
      });
      if(!rows.length){toast('색인표 형식을 인식하지 못했습니다. 제목·문서번호 열이 있는지 확인하세요.',true);return}
      // 업로드 내 동일(날짜·문서번호·제목) 행 중복 제거
      const seen=new Set(), deduped=[];
      rows.forEach(r=>{ const k=`${r.date}|${r.docNum}|${r.title}`; if(seen.has(k))return; seen.add(k); deduped.push(r); });
      const dupCount=rows.length-deduped.length;
      pendingRows=deduped;
      openPreview(deduped,sheetInfo,dupCount);
    }catch(err){toast('파일을 읽지 못했습니다: '+err.message,true)}
  };
  reader.readAsArrayBuffer(file);
}

function openPreview(rows,sheetInfo,fileDup=0){
  // 기존 DB(allDocs)와 대조 → 각 행에 신규 여부 표시
  const existing=new Set(allDocs.map(d=>dupKey(d.date,docNumOf(d),d.title)));
  rows.forEach(r=>{ r._new = !existing.has(dupKey(r.date,r.docNum,r.title)); });
  const newCount=rows.filter(r=>r._new).length;
  const existCount=rows.length-newCount;

  document.getElementById('prev-title').textContent=`엑셀 미리보기 — ${proj.label}`;
  document.getElementById('mp-stat').innerHTML=`
    <div class="b"><div class="n">${rows.length}</div><div class="l">인식된 공문</div></div>
    <div class="b" style="background:#ecfdf5;border-color:#a7f3d0"><div class="n" style="color:#059669">${newCount}</div><div class="l">신규 (등록 대상)</div></div>
    <div class="b" style="background:#f8fafc;border-color:#e2e8f0"><div class="n" style="color:#64748b">${existCount}</div><div class="l">이미 등록됨</div></div>`
    + (fileDup>0?`<div class="b"><div class="n">${fileDup}</div><div class="l">파일 내 중복 제외</div></div>`:'');

  // 신규를 위로 정렬해 무엇이 등록될지 먼저 보이게
  const disp=[...rows].sort((a,b)=>(b._new?1:0)-(a._new?1:0)).slice(0,60);
  document.getElementById('prev-tbody').innerHTML=disp.map((r,i)=>`<tr style="${r._new?'':'opacity:.5'}">
    <td>${i+1}</td>
    <td>${r._new
        ?'<span class="badge" style="background:#ecfdf5;color:#059669">신규</span>'
        :'<span class="badge" style="background:#f1f5f9;color:#64748b">등록됨</span>'}</td>
    <td>${esc(r.date)||'—'}</td><td>${esc(r.docNum)||'—'}</td>
    <td>${esc(r.type)||'—'}</td><td>${esc(r.title)||'—'}</td>
  </tr>`).join('');

  const notes=[];
  if(rows.length>60) notes.push(`상위 60건만 미리보기`);
  notes.push('신규만 추가: 이미 등록된 공문은 제외 · 전체 교체: 기존 삭제 후 등록');
  document.getElementById('prev-note').textContent='※ '+notes.join(' · ');
  setMode('new');
  document.getElementById('prev-modal').classList.add('show');
}
function setMode(m){
  uploadMode=m;
  document.querySelectorAll('#mode-opts .opt').forEach(o=>o.classList.toggle('on',o.dataset.mode===m));
}
function closePreview(){ document.getElementById('prev-modal').classList.remove('show'); pendingRows=[]; }

async function confirmUpload(){
  if(!pendingRows.length){closePreview();return}
  const col=db.collection(`${P}_documents`);

  // 신규만 모드: 등록 직전 최신 DB와 다시 대조해 이미 있는 공문 제외
  let toInsert=pendingRows;
  if(uploadMode==='new'){
    const existing=new Set(allDocs.map(d=>dupKey(d.date,docNumOf(d),d.title)));
    toInsert=pendingRows.filter(r=>!existing.has(dupKey(r.date,r.docNum,r.title)));
    if(!toInsert.length){ toast('추가할 신규 공문이 없습니다 · 모두 이미 등록됨'); closePreview(); return; }
  }
  const n=toInsert.length;
  const skipped=pendingRows.length-n;

  if(uploadMode==='replace'){
    if(!confirm(`기존 ${proj.label} 공문 목록을 전부 삭제하고 ${n}건으로 교체합니다.\n계속하시겠습니까?`)) return;
  }
  const btn=document.getElementById('prev-confirm');
  btn.disabled=true; btn.textContent='등록 중…';
  try{
    // 교체 모드: 기존 문서를 먼저 확보해 두고, 신규 등록이 끝난 뒤에 삭제
    // (삭제를 먼저 하면 등록 중 오류 시 데이터가 통째로 사라질 수 있음)
    let oldDocs=null;
    if(uploadMode==='replace'){ oldDocs=(await col.get()).docs; }
    const base=Date.now();
    await commitInChunks(toInsert,(batch,row,i)=>{
      const {_new,...clean}=row;   // 내부 표시용 플래그는 저장 제외
      batch.set(col.doc(),{
        ...clean, seq:base+i,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    if(oldDocs&&oldDocs.length){ await commitInChunks(oldDocs,(batch,d)=>batch.delete(d.ref)); }
    closePreview();
    toast(`✓ ${n}건 등록${skipped>0?` · ${skipped}건 중복 제외`:''}`);
  }catch(e){toast('등록 실패: '+e.message,true)}
  finally{btn.disabled=false;btn.textContent='등록하기'}
}

// Firestore 배치 최대 500 → 400 단위로 분할 커밋
async function commitInChunks(items,apply){
  for(let i=0;i<items.length;i+=400){
    const batch=db.batch();
    items.slice(i,i+400).forEach((it,j)=>apply(batch,it,i+j));
    await batch.commit();
  }
}

/* ── 엑셀 다운로드 (연차별 시트) ── */
function downloadDocExcel(){
  const btn=document.getElementById('btn-doc-dl');
  btn.textContent='생성 중…';btn.disabled=true;
  const t=new Date();
  const today=`${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,'0')}.${String(t.getDate()).padStart(2,'0')}`;
  const header=['No.','스캔','날짜','문서번호','로컬/해외','구분','항목','비목','세목','역량','제목'];
  const cols=[{wch:6},{wch:6},{wch:12},{wch:12},{wch:9},{wch:8},{wch:20},{wch:14},{wch:14},{wch:12},{wch:56}];

  // 연차별로 분류
  const groups={};   // key: '1'~'5' 또는 'x'
  allDocs.forEach(d=>{ const k=fyKey(d); (groups[k]||(groups[k]=[])).push(d); });

  const wb=XLSX.utils.book_new();
  let any=false;
  ['1','2','3','4','5','x'].forEach(k=>{
    const list=groups[k]; if(!list||!list.length) return;
    list.sort((a,b)=>cmpDocNum(docNumOf(a),docNumOf(b)));   // 문서번호 순
    const info = k==='x' ? {label:'미분류',range:''} : FY_INFO[+k];
    const rows=[];
    rows.push([`${proj.label} 공문 색인표 — ${info.label}${info.range?` (${info.range})`:''}`,'','','','','','','','','',`생성일: ${today}`]);
    rows.push([]);
    rows.push(header);
    list.forEach((d,i)=>rows.push([i+1,d.scan||'',d.date||'',docNumOf(d),d.region||'',d.type||'',d.item||'',d.bimok||'',d.semok||'',d.capability||'',d.title||'']));
    const ws=XLSX.utils.aoa_to_sheet(rows); ws['!cols']=cols;
    XLSX.utils.book_append_sheet(wb,ws,k==='x'?'미분류':`${k}차년도`);
    any=true;
  });
  if(!any){ const ws=XLSX.utils.aoa_to_sheet([header]); ws['!cols']=cols; XLSX.utils.book_append_sheet(wb,ws,'공문색인표'); }

  XLSX.writeFile(wb,`RISE_공문색인_${proj.label}_${today.replace(/\./g,'')}.xlsx`);
  btn.textContent='⬇ 엑셀 다운로드';btn.disabled=false;
}
